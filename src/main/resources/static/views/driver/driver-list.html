<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Driver list</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/footer.css">
    <link rel="stylesheet" href="../../styles/driver/driverList.css">
    <link rel="stylesheet" href="/styles/utils/customAlert.css">
</head>
<body>
<div class="driver">
    <header class="driver-header">
        <div class="driver-header-brand">
            <img class="driver-header-logo" src="../../imgs/PLS.png" alt="Passage Logistics Systems">
        </div>
        <div class="driver-header-actions">
            <div class="driver-header-section-a">
                <button id="dashboard-btn">Dashboard</button>
            </div>
            <div class="driver-header-section-b">
                <nav class="driver-navigation" aria-label="Driver navigation">
                    <div class="driver-navigation-group">
                        <button type="button" id="driver-navigation-btn">Driver</button>
                        <div class="driver-navigation-menu" id="driver-navigation-menu">
                            <a href="#" id="create-driver-btn">Create Driver</a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main class="driver-body">
        <div class="driver-body-search">
            <input id="search" type="text" placeholder="Search by driver name" maxlength="250">
            <button id="search-btn">Search</button>
        </div>
        <div class="driver-body-list">
            <div id="driver-list-container">
                <!-- Driver items will be rendered here -->
            </div>
        </div>
        <div class="driver-body-pagination">
            <button id="previous-page-btn">Previous page</button>
            <button id="next-page-btn">Next page</button>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-profile-section"><a href="https://github.com/mohammedsaji/mohammedsaji" target="_blank" rel="noopener noreferrer">GitHub </a>
            <a href="http://www.linkedin.com/in/mohammed-shajith-e" target="_blank" rel="noopener noreferrer"> LinkedIn </a>
            <a href="mailto:althafshajid@gmail.com"> Gmail </a>
        </div>
        <p>&copy; 2026 Passage Logistics Systems. All rights reserved.</p>
    </footer>
</div>
<div id="custom-alert" class="custom-alert">
    <div class="custom-alert-box">
        <div id="custom-alert-message" class="custom-alert-message"></div>
        <button type="button" id="custom-alert-close">OK</button>
    </div>
</div>
<script src="../../js/utility/customAlert.js"></script>
<script src="../../js/ajaxCalls/ajaxCalls.js"></script>
<script src="../../js/driver/driverList.js"></script>
</body>
</html>

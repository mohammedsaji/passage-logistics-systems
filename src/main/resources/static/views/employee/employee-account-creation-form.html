<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee creation form</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/footer.css">
    <link rel="stylesheet" href="../../styles/employee/employeeCreationForm.css">
    <link rel="stylesheet" href="/styles/utils/customAlert.css">
</head>
<body>
<div class="employee">
    <header class="employee-header">
        <div class="employee-header-brand">
            <img class="employee-header-logo" src="../../imgs/PLS.png" alt="Passage Logistics Systems">
        </div>
        <div class="employee-header-actions">
            <div class="employee-header-section-a">
                <button id="dashboard-btn">Dashboard</button>
            </div>
        </div>
    </header>
    <main class="employee-body">
        <div class="employee-body-form">
            <form class="employee-body-employee-form">
                <div>
                    <label for="employee-name">Employee Name </label>
                    <input id="employee-name" type="text" maxlength="250" required>
                </div>
                <div>
                    <label for="employee-phone-no">Employee Phone No </label>
                    <input id="employee-phone-no" type="text" maxlength="25" required>
                </div>
                <div>
                    <label for="employee-department">Employee Department </label>
                    <input id="employee-department" type="text" maxlength="30" required>
                </div>
                <div>
                    <label for="employee-joining-date">Employee joining date </label>
                    <input style="text-overflow: ellipsis" id="employee-joining-date" type="datetime-local" required>
                </div>
                <div>
                    <label for="employee-status">Employee Status </label>
                    <select id="employee-status" required>
                        <option value="">Select one</option>
                        <option value="ACTIVE">Active</option>
                        <option value="IN_ACTIVE">In Active</option>
                    </select>
                </div>
                <div id="reporting-manager-id-display" style="display:none;">
                    <label for="reporting-manager-id">Reporting Manager Id </label>
                    <input id="reporting-manager-id" type="number" readonly>
                </div>
                <div id="employee-body-employee-actions">
                    <button type="submit" id="create-btn">Create</button>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-profile-section">
            <a href="https://github.com/mohammedsaji/mohammedsaji" target="_blank" rel="noopener noreferrer">GitHub </a>
            <a href="http://www.linkedin.com/in/mohammed-shajith-e" target="_blank" rel="noopener noreferrer"> LinkedIn </a>
            <a href="mailto:althafshajid@gmail.com"> Gmail </a>
        </div>
        <p>&copy; 2026 Passage Logistics Systems. All rights reserved.</p>
    </footer>
</div>
<div id="custom-alert" class="custom-alert">
    <div class="custom-alert-box">
        <div id="custom-alert-message" class="custom-alert-message"></div>
        <button type="button" id="custom-alert-close">OK</button>
    </div>
</div>
<script src="../../js/utility/customAlert.js"></script>
<script src="../../js/ajaxCalls/ajaxCalls.js"></script>
<script src="../../js/employee/employeeAccountCreationForm.js"></script>
</body>
</html>

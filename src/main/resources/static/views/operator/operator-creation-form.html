<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create operator</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/footer.css">
    <link rel="stylesheet" href="../../styles/operator/operatorCreationForm.css">
    <link rel="stylesheet" href="/styles/utils/customAlert.css">
</head>
<body>

<div class="operator">
    <header class="operator-header">
        <div class="operator-header-brand">
            <img class="operator-header-logo" src="../../imgs/PLS.png" alt="Passage Logistics Systems">
        </div>
        <div class="operator-header-actions">
            <div class="operator-header-section-a">
                <button type="button" id="dashboard-btn">Dashboard</button>
            </div>
            <div class="operator-header-section-b">
                <nav class="operator-navigation" aria-label="Operator navigation">
                    <div class="operator-navigation-group">
                        <button type="button" id="operator-navigation-btn">Operator</button>
                        <div class="operator-navigation-menu" id="operator-navigation-menu">
                            <a href="#" id="operator-list-btn">Manage Operators</a>
                            <a href="#" id="create-operator-btn">Create Operator</a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main class="operator-body">
        <div class="operator-body-form">
            <form class="operator-body-operator-form">
                <div>
                    <label for="operator-name">Operator Name </label>
                    <input id="operator-name" type="text" maxlength="250" required>
                </div>

                <div>
                    <label for="operator-transport-type">Transportation Mode </label>
                    <select id="operator-transport-type" required>
                        <option value="" selected>Select one</option>
                        <option value="AIR">Air ways</option>
                        <option value="SEA">Sea ways</option>
                        <option value="RAIL">Rail ways</option>
                        <option value="ROAD">Road ways</option>
                    </select>
                </div>

                <div class="operator-body-operator-actions">
                    <button type="submit" id="create-btn">Create</button>
                </div>
            </form>
        </div>
    </main>
    <<footer class="footer">
        <div class="footer-profile-section"><a href="https://github.com/mohammedsaji/mohammedsaji" target="_blank" rel="noopener noreferrer">GitHub </a>
            <a href="http://www.linkedin.com/in/mohammed-shajith-e" target="_blank" rel="noopener noreferrer"> LinkedIn </a>
            <a href="mailto:althafshajid@gmail.com"> Gmail </a>
        </div>
        <p>&copy; 2026 Passage Logistics Systems. All rights reserved.</p>
    </footer>
</div>
<div id="custom-alert" class="custom-alert">
    <div class="custom-alert-box">
        <div id="custom-alert-message" class="custom-alert-message"></div>
        <button type="button" id="custom-alert-close">OK</button>
    </div>
</div>
<script src="../../js/utility/customAlert.js"></script>
<script src="../../js/ajaxCalls/ajaxCalls.js"></script>
<script src="../../js/operator/operatorCreationForm.js"></script>
</body>
</html>

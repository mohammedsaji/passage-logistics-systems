<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transport types</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/footer.css">
    <link rel="stylesheet" href="../../styles/operator/transportTypes.css">
    <link rel="stylesheet" href="/styles/utils/customAlert.css">
</head>
<body>
<div class="transport-type">
    <header class="transport-type-header">
        <div class="transport-type-header-brand">
            <img class="transport-type-header-logo" src="../../imgs/PLS.png" alt="Passage Logistics Systems">
        </div>
        <div class="transport-type-header-actions">
            <div class="transport-type-header-section-a">
                <button id="dashboard-btn">Dashboard</button>
            </div>
        </div>
    </header>
    <main class="transport-type-body">
        <div class="transport-type-body-options">
            <button id="air-btn" data-transport-type="AIR">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                    <path d="M2 16l20-7-4 14-4-6-6-1z"/>
                </svg>
                Air ways
            </button>
            <button id="sea-btn" data-transport-type="SEA">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                    <path d="M3 18l1.5-4h15L21 18M6 14V8h12v6M9 8V5h6v3"/>
                </svg>
                Sea ways
            </button>
            <button id="rail-btn" data-transport-type="RAIL">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                    <rect x="5" y="4" width="14" height="13" rx="0"/>
                    <path d="M5 12h14M8 17l-2 3M16 17l2 3M8 8h8"/>
                </svg>
                Rail ways
            </button>
            <button id="road-btn" data-transport-type="ROAD">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                    <path d="M4 18l3-13h10l3 13M2 18h20M9 5v3M15 5v3"/>
                </svg>
                Road ways
            </button>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-profile-section"><a href="https://github.com/mohammedsaji/mohammedsaji" target="_blank" rel="noopener noreferrer">GitHub </a>
            <a href="http://www.linkedin.com/in/mohammed-shajith-e" target="_blank" rel="noopener noreferrer"> LinkedIn </a>
            <a href="mailto:althafshajid@gmail.com"> Gmail </a>
        </div>
        <p>&copy; 2026 Passage Logistics Systems. All rights reserved.</p>
    </footer>
</div>
<div id="custom-alert" class="custom-alert">
    <div class="custom-alert-box">
        <div id="custom-alert-message" class="custom-alert-message"></div>
        <button type="button" id="custom-alert-close">OK</button>
    </div>
</div>
<script src="../../js/utility/customAlert.js"></script>
<script src="../../js/ajaxCalls/ajaxCalls.js"></script>
<script src="../../js/operator/transportTypes.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <link rel="stylesheet" href="/styles/profile.css">
    <link rel="stylesheet" href="/styles/utils/customAlert.css">
</head>
<body>

<div class="profile">
    <header class="profile-header">
        <div class="profile-header-brand-icon">
            <img class="profile-header-logo" src="../imgs/PLS.png" alt="Passage Logistics Systems">
        </div>
        <div class="profile-header-actions">
            <div class="profile-header-section-a">
                <button id="profile-back-btn">Back</button>
                <button id="profile-sign-out-btn">Sign out</button>
            </div>
        </div>

    </header>

    <main class="profile-body">
        <div class="profile-body-section">
            <h2 class="profile-body-section-title">
                Account Information
            </h2>
            <div class="profile-body-section-content">
                <label for="profile-username">Username :</label>
                <input id="profile-username" type="text" readonly>

                <label for="profile-contact">Contact :</label>
                <input id="profile-contact" type="text" readonly>

                <label for="profile-email">Email :</label>
                <input id="profile-email" type="text" readonly>

                <label for="profile-role">Role :</label>
                <input id="profile-role" type="text" readonly>

                <label for="profile-manager-id-ref">Manager Id :</label>
                <input id="profile-manager-id-ref" type="number" readonly>

                <label for="profile-status">Status :</label>
                <input id="profile-status" type="text" readonly>
            </div>
        </div>

        <div class="profile-body-section" id="profile-manager-section">

            <h2 class="profile-body-section-title">
                Manager Information
            </h2>

            <div class="profile-body-section-content">

                <label for="profile-manager-id">Manager Id :</label>
                <input id="profile-manager-id" type="text" readonly>

                <label for="profile-manager-name">Manager Name :</label>
                <input id="profile-manager-name" type="text" readonly>

                <label for="profile-manager-contact-no">
                    Contact Number :
                </label>
                <input id="profile-manager-contact-no" type="text" readonly>

                <label for="profile-manager-status">
                    Manager Status :
                </label>
                <input id="profile-manager-status" type="text" readonly>
            </div>
        </div>


        <div class="profile-body-section" id="profile-operator-section">

            <h2 class="profile-body-section-title">
                Operator Information
            </h2>

            <div class="profile-body-section-content">

                <label for="profile-operator-id">Operator Id :</label>
                <input id="profile-operator-id" type="text" readonly>

                <label for="profile-operator-name">Operator Name :</label>
                <input id="profile-operator-name" type="text" readonly>

                <label for="profile-operator-transport-type">
                    Transport Type :
                </label>
                <input id="profile-operator-transport-type" type="text" readonly>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-profile-section">
            <a href="https://github.com/mohammedsaji/mohammedsaji" target="_blank" rel="noopener noreferrer">GitHub </a>
            <a href="http://www.linkedin.com/in/mohammed-shajith-e" target="_blank" rel="noopener noreferrer"> LinkedIn </a>
            <a href="mailto:althafshajid@gmail.com"> Gmail </a>
        </div>
        <p>&copy; 2026 Passage Logistics Systems. All rights reserved.</p>
    </footer>
</div>
<div id="custom-alert" class="custom-alert">
    <div class="custom-alert-box">
        <div id="custom-alert-message" class="custom-alert-message"></div>
        <button type="button" id="custom-alert-close">OK</button>
    </div>
</div>
<script src="../js/utility/customAlert.js"></script>
<script src="/js/ajaxCalls/ajaxCalls.js"></script>
<script src="/js/profile.js"></script>

</body>
</html>

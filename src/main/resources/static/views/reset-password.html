<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!--    <meta name="viewport" content="width=device-width, initial-scale=1.0">-->
    <title>Reset Password</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <link rel="stylesheet" href="/styles/resetPassword.css">
    <link rel="stylesheet" href="/styles/utils/customAlert.css">
</head>
<body>
<div class="password-reset">
    <header class="password-reset-header">
        <div class="password-reset-header-brand">
            <img class="password-reset-header-logo" src="/imgs/PLS.png" alt="Passage Logistics Systems">
        </div>
    </header>
    <main class="password-reset-body">
        <section class="password-reset-form">
            <h2>Reset Password</h2>
            <p>Enter your new password and confirm your password.</p>

            <form id="password-reset-form">
                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <div>
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                </div>

                <button type="submit" id="password-reset-btn">Reset Password</button>
            </form>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-profile-section">
            <a href="https://github.com/mohammedsaji/mohammedsaji" target="_blank" rel="noopener noreferrer">GitHub </a>
            <a href="http://www.linkedin.com/in/mohammed-shajith-e" target="_blank" rel="noopener noreferrer"> LinkedIn </a>
            <a href="mailto:althafshajid@gmail.com"> Gmail </a>
        </div>
        <p>&copy; 2026 Passage Logistics Systems. All rights reserved.</p>
    </footer>
</div>
<div id="custom-alert" class="custom-alert">
    <div class="custom-alert-box">
        <div id="custom-alert-message" class="custom-alert-message"></div>
        <button type="button" id="custom-alert-close">OK</button>
    </div>
</div>
<script src="../js/utility/customAlert.js"></script>
<script src="/js/ajaxCalls/ajaxCalls.js"></script>
<script src="/js/resetPassword.js"></script>
</body>
</html>

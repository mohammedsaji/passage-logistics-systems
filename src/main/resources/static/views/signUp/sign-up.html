<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/footer.css">
    <link rel="stylesheet" href="../../styles/signUp/signUp.css">
    <link rel="stylesheet" href="/styles/utils/customAlert.css">
</head>
<body>
<div class="sign-up">
    <header class="sign-up-header">
        <div class="sign-up-header-brand">
            <img class="sign-up-header-logo" src="../../imgs/PLS.png" alt="Passage Logistics Systems">
        </div>
    </header>
    <main class="sign-up-body">
        <div class="sign-up-body-sign-up-display">
            <div class="sign-up-box">
                <h1>SIGN UP</h1>
                <form class="sign-up-body-sign-up-form">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" autocomplete="username" required>
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" autocomplete="email" required>
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" autocomplete="new-password" required>
                    <label for="account-holder-role">Role</label>
                    <select id="account-holder-role" required>
                        <option value="" disabled selected>Select role</option>
                        <option value="CEO">Ceo</option>
                        <option value="FEDERATE-MANAGER">Federate Manager</option>
                        <option value="FEDERATE-DRIVER">Federate Driver</option>
                        <option value="ADMIN">Admin</option>
                        <option value="DEVELOPER">Developer</option>
                        <option value="BUSINESS-ANALYST">Business Analyst</option>
                        <option value="DATA-ENGINEER">Data Engineer</option>
                        <option value="SOFTWARE ENGINEER">Software Engineer</option>
                        <option value="MANAGER">Manager</option>
                    </select>
                    <label for="employee-manager-role">Select Role:</label>
                    <select id="employee-manager-role" name="employee-manager-role" required>
                        <option value="" disabled selected>-- Select an option --</option>
                        <option value="MANAGER">MANAGER</option>
                        <option value="NOT-MANAGER">NOT-MANAGER</option>
                    </select>
                    <button type="button" id="submit-btn">Proceed</button>
                </form>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-profile-section">
            <a href="https://github.com/mohammedsaji/mohammedsaji" target="_blank" rel="noopener noreferrer">GitHub </a>
            <a href="http://www.linkedin.com/in/mohammed-shajith-e" target="_blank" rel="noopener noreferrer"> LinkedIn </a>
            <a href="mailto:althafshajid@gmail.com"> Gmail </a>
        </div>
        <p>&copy; 2026 Passage Logistics Systems. All rights reserved.</p>
    </footer>
</div>
<div id="custom-alert" class="custom-alert">
    <div class="custom-alert-box">
        <div id="custom-alert-message" class="custom-alert-message"></div>
        <button type="button" id="custom-alert-close">OK</button>
    </div>
</div>
<script src="../../js/utility/customAlert.js"></script>
<script src="../../js/ajaxCalls/ajaxCalls.js"></script>
<script src="../../js/signUp/signUp.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle screen</title>
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="../../styles/footer.css">
    <link rel="stylesheet" href="../../styles/vehicle/vehicle.css">
    <link rel="stylesheet" href="/styles/utils/customAlert.css">
</head>
<body>
<div class="vehicle">
    <header class="vehicle-header">
        <div class="vehicle-header-brand">
            <img class="vehicle-header-logo" src="../../imgs/PLS.png" alt="Passage Logistics Systems">
        </div>
        <div class="vehicle-header-actions">
            <div class="vehicle-header-section-a">
                <button type="button" id="dashboard-btn">Dashboard</button>
                <button type="button" id="back-to-operator-btn">Back to operator</button>
            </div>
            <div class="vehicle-header-section-b">
                <nav class="vehicle-navigation" aria-label="Vehicle navigation">
                    <div class="vehicle-navigation-group">
                        <button type="button" id="vehicle-navigation-btn">Vehicle</button>
                        <div class="vehicle-navigation-menu" id="vehicle-navigation-menu">
                            <a href="#" id="vehicle-list-btn">Manage Vehicles</a>
                            <a href="#" id="entry-vehicle-btn">Create Vehicle</a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <main class="vehicle-body">
        <div class="vehicle-body-vehicle-display">
            <form class="vehicle-body-vehicle-form">
                <div>
                    <label for="vehicle-id">Vehicle Id :</label>
                    <input type="text" id="vehicle-id" readonly>
                </div>

                <div>
                    <label for="vehicle-type">Vehicle type :</label>
                    <input type="text" id="vehicle-type">
                </div>

                <div>
                    <label for="vehicle-number">Vehicle number :</label>
                    <input type="text" id="vehicle-number">
                </div>

                <div>
                    <label for="operator-id">Operator Id :</label>
                    <input type="text" id="operator-id" readonly>
                </div>

                <div>
                    <label for="created-at">Created at :</label>
                    <input type="text" id="created-at" readonly>
                </div>

                <div>
                    <label for="updated-at">Updated at :</label>
                    <input type="text" id="updated-at" readonly>
                </div>

                <div>
                    <label for="updated-by">Updated by :</label>
                    <input type="text" id="updated-by" readonly>
                </div>
            </form>
        </div>
        <div id="vehicle-body-vehicle-actions" class="vehicle-body-vehicle-actions">
            <button id="update-btn">Update vehicle</button>
            <button id="delete-btn">Delete vehicle</button>
        </div>
        <div id="vehicle-body-common-actions" class="vehicle-body-common-actions">
            <button id="proceed-btn">Proceed</button>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-profile-section">
            <a href="https://github.com/mohammedsaji/mohammedsaji" target="_blank" rel="noopener noreferrer">GitHub </a>
            <a href="http://www.linkedin.com/in/mohammed-shajith-e" target="_blank" rel="noopener noreferrer"> LinkedIn </a>
            <a href="mailto:althafshajid@gmail.com"> Gmail </a>
        </div>
        <p>&copy; 2026 Passage Logistics Systems. All rights reserved.</p>
    </footer>
</div>
<div id="custom-alert" class="custom-alert">
    <div class="custom-alert-box">
        <div id="custom-alert-message" class="custom-alert-message"></div>
        <button type="button" id="custom-alert-close">OK</button>
    </div>
</div>
<script src="../../js/utility/customAlert.js"></script>
<script src="../../js/utility/utility.js"></script>
<script src="../../js/ajaxCalls/ajaxCalls.js"></script>
<script src="../../js/vehicle/vehicle.js"></script>
</body>
</html>
